<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="estilo.css">
    <title>Alpha Supps - Frente de Caixa</title>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="clientes.html">Clientes</a>
        <a href="produtos.html">Produtos</a>
        <a href="vendas.html">Montar Carrinho</a>
        <a href="historico_vendas.html">Histórico de Vendas</a>
        <a href="/logout" style="margin-left: auto; font-weight: bold;">🚪 Sair</a>
    </nav>

    <div class="container">
        <div class="card">
            <h2>Nova Venda (Mestre)</h2>
            
            <label for="selCliente">Selecione o Cliente:</label>
            <select id="selCliente">
                <option value="">Escolha...</option>
            </select>

            <label for="formaPagamento">Forma de Pagamento:</label>
            <select id="formaPagamento">
                <option value="Pix">Pix</option>
                <option value="Cartão de Crédito">Cartão de Crédito</option>
                <option value="Dinheiro">Dinheiro</option>
            </select>
        </div>

        <div class="card">
            <h2>Adicionar Suplementos ao Carrinho (Detalhe)</h2>
            <label for="selProduto">Produto:</label>
            <select id="selProduto"></select>

            <label for="qtdProduto">Quantidade:</label>
            <input type="number" id="qtdProduto" value="1" min="1">

            <button onclick="adicionarAoCarrinho()">➕ Incluir Item</button>
        </div>

        <div class="card">
            <h2>Carrinho de Compras Ativo</h2>
            <table>
                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Qtd</th>
                        <th>Preço Unitário</th>
                        <th>Subtotal</th>
                    </tr>
                </thead>
                <tbody id="corpo-carrinho"></tbody>
            </table>

            <h3 id="txtTotal" style="margin-top: 2rem; color: var(--primary-neon);">Total Geral: R$ 0.00</h3>
            <button onclick="fecharPedido()" style="margin-top: 1rem;">🚀 Finalizar e Emitir Cupom</button>
        </div>
    </div>

    <script>
        let carrinho = [];
        let totalVenda = 0;
        let listaProdutosDB = [];

        window.onload = function() {
            fetch('/listar-clientes')
                .then(res => res.json())
                .then(clientes => {
                    const combo = document.getElementById('selCliente');
                    clientes.forEach(c => {
                        combo.innerHTML += `<option value="${c.id}">${c.nome}</option>`;
                    });
                });

            fetch('/listar-produtos')
                .then(res => res.json())
                .then(produtos => {
                    listaProdutosDB = ...produtos;
                    const combo = document.getElementById('selProduto');
                    produtos.forEach(p => {
                        combo.innerHTML += `<option value="${p.id}">${p.descricao} (${p.peso_gramas}g) - R$ ${p.preco.toFixed(2)}</option>`;
                    });
                });
        };

        function adicionarAoCarrinho() {
            const produtoId = parseInt(document.getElementById('selProduto').value);
            const qtd = parseInt(document.getElementById('qtdProduto').value);
            const itemOriginal = listaProdutosDB.find(p => p.id === produtoId);

            if(!itemOriginal) return;

            carrinho.push({
                id: itemOriginal.id,
                descricao: itemOriginal.descricao,
                quantidade: qtd,
                preco: itemOriginal.preco
            });

            renderizarCarrinho();
        }

        function renderizarCarrinho() {
            const corpo = document.getElementById('corpo-carrinho');
            corpo.innerHTML = "";
            totalVenda = 0;

            carrinho.forEach(item => {
                const subtotal = item.preco * item.quantidade;
                totalVenda += subtotal;
                corpo.innerHTML += `
                    <tr>
                        <td>${item.descricao}</td>
                        <td>${item.whitespace_fix ? 1 : item.quantidade}</td>
                        <td>R$ ${item.preco.toFixed(2)}</td>
                        <td>R$ ${subtotal.toFixed(2)}</td>
                    </tr>`;
            });

            document.getElementById('txtTotal').innerText = `Total Geral: R$ ${totalVenda.toFixed(2)}`;
        }

        function fecharPedido() {
            const clienteId = document.getElementById('selCliente').value;
            const formaPag = document.getElementById('formaPagamento').value;

            if(!clienteId || carrinho.length === 0) {
                alert("Preencha o cliente e adicione produtos ao carrinho.");
                return;
            }

            const pacote = {
                cliente_id: clienteId,
                forma_pagamento: formaPag,
                total: totalVenda,
                itens: carrinho
            };

            fetch('/finalizar-pedido', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(pacote)
            })
            .then(res => res.json())
            .then(res => {
                if(res.success) {
                    alert("Venda realizada com sucesso!");
                    window.location.href = "historico_vendas.html";
                }
            });
        }
    </script>
</body>
</html>
