<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="estilo.css">
    <title>Alpha Supps - Caixa</title>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="clientes.html">Clientes</a>
        <a href="produtos.html">Produtos</a>
        <a href="vendas.html">Montar Carrinho</a>
        <a href="historico_vendas.html">Histórico de Vendas</a>
        <a href="/logout" style="margin-left: auto; background: var(--accent-red); color: white; padding: 6px 15px; border-radius: 4px; font-weight: bold;">🚪 Sair</a>
    </nav>

    <div class="container">
        <div class="card">
            <h2>Nova Venda</h2>
            <label for="selCliente">Selecione o Cliente:</label>
            <select id="selCliente"><option value="">Escolha...</option></select>
            <label for="formaPagamento">Forma de Pagamento:</label>
            <select id="formaPagamento">
                <option value="Pix">Pix</option>
                <option value="Cartão">Cartão</option>
                <option value="Dinheiro">Dinheiro</option>
            </select>
        </div>

        <div class="card">
            <h2>Adicionar Itens</h2>
            <label for="selProduto">Suplemento:</label>
            <select id="selProduto"></select>
            <label for="qtdProduto">Quantidade:</label>
            <input type="number" id="qtdProduto" value="1" min="1">
            <button onclick="adicionarAoCarrinho()">🛒 Adicionar Item</button>
        </div>

        <div class="card">
            <h2>Carrinho de Compras</h2>
            <table>
                <thead><tr><th>Produto</th><th>Qtd</th><th>Preço</th><th>Subtotal</th></tr></thead>
                <tbody id="corpo-carrinho"></tbody>
            </table>
            <h3 id="txtTotal" style="margin-top:1.5rem; color:var(--primary-neon);">Total Geral: R$ 0.00</h3>
            <button onclick="fecharPedido()" style="background:var(--primary-neon); color:black;">🚀 Finalizar Venda</button>
        </div>
    </div>

    <script>
        let carrinho = [];
        let totalVenda = 0;
        let dbProdutos = [];

        window.onload = function() {
            fetch('/listar-clientes').then(res => res.json()).then(data => {
                const s = document.getElementById('selCliente');
                data.forEach(c => s.innerHTML += `<option value="${c.id}">${c.nome}</option>`);
            });
            fetch('/listar-produtos').then(res => res.json()).then(data => {
                dbProdutos = data;
                const s = document.getElementById('selProduto');
                data.forEach(p => s.innerHTML += `<option value="${p.id}">${p.descricao} (${p.peso_gramas}g)</option>`);
            });
        };

        function adicionarAoCarrinho() {
            const pId = parseInt(document.getElementById('selProduto').value);
            const qtd = parseInt(document.getElementById('qtdProduto').value);
            const produtoObj = dbProdutos.find(p => p.id === pId);

            if(!produtoObj) return;

            carrinho.push({ id: produtoObj.id, descricao: produtoObj.descricao, quantidade: qtd, preco: produtoObj.preco });
            atualizarGrade();
        }

        function atualizarGrade() {
            const corpo = document.getElementById('corpo-carrinho');
            corpo.innerHTML = "";
            totalVenda = 0;
            carrinho.forEach(item => {
                let sub = item.preco * item.whitespace_fix ? 1 : item.quantidade;
                totalVenda += sub;
                corpo.innerHTML += `<tr><td>${item.descricao}</td><td>${item.quantidade}</td><td>R$ ${item.preco.toFixed(2)}</td><td>R$ ${sub.toFixed(2)}</td></tr>`;
            });
            document.getElementById('txtTotal').innerText = `Total Geral: R$ ${totalVenda.toFixed(2)}`;
        }

        function fecharPedido() {
            const cId = document.getElementById('selCliente').value;
            if(!cId || carrinho.length === 0) return alert("Preencha o cliente e adicione itens!");

            fetch('/finalizar-pedido', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cliente_id: cId, forma_pagamento: document.getElementById('formaPagamento').value, total: totalVenda, itens: carrinho })
            }).then(res => res.json()).then(res => {
                if(res.success) { alert("Venda Concluída!"); window.location.href = "historico_vendas.html"; }
            });
        }
    </script>
</body>
</html>
