<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Alpha Supps - Autenticação</title>
    <style>
        body {
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-container {
            max-width: 400px;
            width: 100%;
            margin: 0 auto;
            padding: 1rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="card" style="text-align: center;">
            <h1 style="color: var(--primary-neon); font-size: 2rem; margin-bottom: 0.5rem;">ALPHA <span style="color:white;">SUPPS</span></h1>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem;">Restrito a Colaboradores</p>
            
            <form action="/login" method="POST">
                <label for="senha" style="text-align: left;">Digite a Senha de Acesso:</label>
                <input type="password" id="senha" name="senha" placeholder="••••" required style="text-align: center; font-size: 1.5rem; letter-spacing: 5px;">
                
                <button type="submit">🔓 Entrar no Sistema</button>
            </form>
            
            <div id="erro" style="color: var(--accent-red); margin-top: 15px; font-size: 0.9rem; display: none;">
                Senha incorreta! Tente novamente.
            </div>
        </div>
    </div>

    <script>
        // Captura se a URL possui erro para exibir o aviso
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('erro')) {
            document.getElementById('erro').style.display = 'block';
        }
    </script>
</body>
</html>
