<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="estilo.css">
    <title>Alpha Supps - Histórico</title>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="clientes.html">Clientes</a>
        <a href="produtos.html">Produtos</a>
        <a href="vendas.html">Montar Carrinho</a>
        <a href="historico_vendas.html">Histórico de Vendas</a>
        <a href="/logout" style="margin-left: auto; background: var(--accent-red); color: white; padding: 6px 15px; border-radius: 4px; font-weight: bold;">🚪 Sair</a>
    </nav>

    <div class="container">
        <div class="card">
            <h2>Histórico de Pedidos</h2>
            <table>
                <thead><tr><th>ID</th><th>Data</th><th>Cliente</th><th>Pagamento</th><th>Total</th><th>Ação</th></tr></thead>
                <tbody id="lista-pedidos-mestre"></tbody>
            </table>
        </div>

        <div class="card" id="card-detalhes" style="display:none;">
            <h2>Itens do Pedido #<span id="num-pedido"></span></h2>
            <table>
                <thead><tr><th>Suplemento</th><th>Tamanho</th><th>Qtd</th><th>Preço Pago</th></tr></thead>
                <tbody id="lista-produtos-detalhe"></tbody>
            </table>
        </div>
    </div>

    <script>
        window.onload = function() {
            fetch('/listar-pedidos').then(res => res.json()).then(pedidos => {
                const tabela = document.getElementById('lista-pedidos-mestre');
                tabela.innerHTML = "";
                pedidos.forEach(p => {
                    const nome = p.nome_cliente ? p.nome_cliente : "Cliente Removido";
                    tabela.innerHTML += `<tr>
                        <td>#00${p.id}</td><td>${p.data}</td><td>${nome}</td><td>${p.forma_pagamento}</td>
                        <td style="color:var(--primary-neon)">R$ ${p.total.toFixed(2)}</td>
                        <td><button onclick=\"verDetalhes(${p.id})\" style=\"width:auto; padding:5px 10px; margin:0;\">🔍 Ver Itens</button></td>
                    </tr>`;
                });
            });
        };

        function verDetalhes(id) {
            fetch(`/detalhes-pedido/${id}`).then(res => res.json()).then(itens => {
                document.getElementById('card-detalhes').style.display = 'block';
                document.getElementById('num-pedido').innerText = id;
                const corpo = document.getElementById('lista-produtos-detalhe');
                corpo.innerHTML = "";
                itens.forEach(i => {
                    corpo.innerHTML += `<tr><td><strong>${i.descricao}</strong></td><td>${i.peso_gramas}g</td><td>${i.quantidade}x</td><td>R$ ${i.preco_cobrado.toFixed(2)}</td></tr>`;
                });
            });
        }
    </script>
</body>
</html>
