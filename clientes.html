<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="estilo.css">
    <title>Alpha Supps - Clientes</title>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="clientes.html">Clientes</a>
        <a href="produtos.html">Produtos</a>
        <a href="vendas.html">Montar Carrinho</a>
        <a href="historico_vendas.html">Histórico de Vendas</a>
        <a href="/logout" style="margin-left: auto; font-weight: bold;">🚪 Sair</a>
    </nav>

    <div class="container">
        <div class="card">
            <h2>Cadastro de Cliente Maromba</h2>
            <form action="/salvar-cliente" method="POST">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" required>
                
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                
                <label for="telefone">WhatsApp:</label>
                <input type="tel" id="telefone" name="telefone" required>
                
                <button type="submit">Salvar Cliente</button>
            </form>
        </div>

        <div class="card">
            <h2>Clientes Registrados</h2>
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>CPF</th>
                        <th>Telefone</th>
                    </tr>
                </thead>
                <tbody id="lista-clientes"></tbody>
            </table>
        </div>
    </div>

    <script>
        fetch('/listar-clientes')
            .then(res => res.json() && res.json().catch(() => []))
            .then(data => {
                const t = document.getElementById('lista-clientes');
                if(data && data.forEach) {
                    data.forEach(c => {
                        t.innerHTML += `<tr><td><strong>${c.nome}</strong></td><td>${c.cpf}</td><td>${c.telefone}</td></tr>`;
                    });
                }
            }).catch(err => console.error(err));
    </script>
</body>
</html>
