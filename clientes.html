<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="estilo.css">
    <title>Alpha Supps - Clientes</title>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="clientes.html">Clientes</a>
        <a href="produtos.html">Produtos</a>
        <a href="vendas.html">Montar Carrinho</a>
        <a href="historico_vendas.html">Histórico de Vendas</a>
    </nav>

    <div class="container">
        <div class="card" id="card-formulario">
            <h2 id="titulo-form">Cadastro de Cliente Maromba</h2>
            <form id="form-cliente" action="/salvar-cliente" method="POST">
                <input type="hidden" id="cliente-id">
                
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" required>
                
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                
                <label for="telefone">WhatsApp:</label>
                <input type="tel" id="telefone" name="telefone" required>
                
                <button type="submit" id="btn-submit">Salvar Cliente</button>
                <button type="button" id="btn-cancelar" style="background:#333; color:white; display:none; margin-top:0.5rem;" onclick="cancelarEdicao()">Cancelar Edição</button>
            </form>
        </div>

        <div class="card">
            <h2>Clientes Registrados</h2>
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>CPF</th>
                        <th>Telefone</th>
                        <th style="width: 150px; text-align: center;">Ações</th>
                    </tr>
                </thead>
                <tbody id=\"lista-clientes\"></tbody>
            </table>
        </div>
    </div>

    <script>
        let clientesLista = [];

        function carregarClientes() {
            fetch('/listar-clientes')
                .then(res => res.json())
                .then(data => {
                    clientesLista = data;
                    const t = document.getElementById('lista-clientes');
                    t.innerHTML = "";
                    data.forEach(c => {
                        t.innerHTML += `
                            <tr>
                                <td><strong>${c.nome}</strong></td>
                                <td>${c.cpf}</td>
                                <td>${c.telefone}</td>
                                <td style="text-align: center;">
                                    <button onclick="prepararEdicao(${c.id})" style="width:auto; padding: 6px 12px; margin:0 4px; font-size:0.8rem; background:#23232a; color:white;">✏️</button>
                                    <button onclick="excluirCliente(${c.id})" style="width:auto; padding: 6px 12px; margin:0 4px; font-size:0.8rem; background:var(--accent-red); color:white;">🗑️</button>
                                </td>
                            </tr>`;
                    });
                });
        }

        // Intercepta o envio do formulário para decidir se cria ou edita via AJAX
        document.getElementById('form-cliente').addEventListener('submit', function(e) {
            const id = document.getElementById('cliente-id').value;
            if(id) {
                e.preventDefault(); // Impede o redirecionamento padrão do form estrutural
                
                const pacote = {
                    nome: document.getElementById('nome').value,
                    cpf: document.getElementById('cpf').value,
                    telefone: document.getElementById('telefone').value
                };

                fetch(`/editar-cliente/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(pacote)
                })
                .then(res => res.json())
                .then(res => {
                    if(res.success) {
                        alert("Cliente atualizado com sucesso!");
                        cancelarEdicao();
                        carregarClientes();
                    }
                });
            }
        });

        function prepararEdicao(id) {
            const cliente = clientesLista.find(c => c.id === id);
            if(!cliente) return;

            document.getElementById('cliente-id').value = cliente.id;
            document.getElementById('nome').value = cliente.nome;
            document.getElementById('cpf').value = cliente.cpf;
            document.getElementById('telefone').value = cliente.telefone;

            document.getElementById('titulo-form').innerText = "Editar Cadastro de Cliente";
            document.getElementById('btn-submit').innerText = "💾 Atualizar Dados";
            document.getElementById('btn-cancelar').style.display = "block";
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function cancelarEdicao() {
            document.getElementById('cliente-id').value = "";
            document.getElementById('form-cliente').reset();
            document.getElementById('titulo-form').innerText = "Cadastro de Cliente Maromba";
            document.getElementById('btn-submit').innerText = "Salvar Cliente";
            document.getElementById('btn-cancelar').style.display = "none";
        }

        function excluirCliente(id) {
            if(confirm("Tem certeza que deseja remover permanentemente este cliente do sistema?")) {
                fetch(`/excluir-cliente/${id}`, { method: 'DELETE' })
                    .then(res => res.json())
                    .then(res => {
                        if(res.success) {
                            alert("Cliente excluído.");
                            carregarClientes();
                        }
                    });
            }
        }

        window.onload = carregarClientes;
    </script>
</body>
</html>
