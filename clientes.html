<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="estilo.css">
    <title>Alpha Supps - Clientes</title>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="clientes.html">Clientes</a>
        <a href="produtos.html">Produtos</a>
        <a href="vendas.html">Montar Carrinho</a>
        <a href="historico_vendas.html">Histórico de Vendas</a>
        <a href="/logout" style="margin-left: auto; background: var(--accent-red); color: white; padding: 6px 15px; border-radius: 4px; font-weight: bold;">🚪 Sair</a>
    </nav>

    <div class="container">
        <div class="card">
            <h2 id="titulo-form">Cadastro de Cliente Maromba</h2>
            <form id="form-cliente" action="/salvar-cliente" method="POST">
                <input type="hidden" id="cliente-id">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" required>
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                <label for="telefone">WhatsApp:</label>
                <input type="tel" id="telefone" name="telefone" required>
                <button type="submit" id="btn-submit">Salvar Cliente</button>
                <button type="button" id="btn-cancelar" style="background:#333; color:white; display:none; margin-top:0.5rem;" onclick="cancelarEdicao()">Cancelar Edição</button>
            </form>
        </div>

        <div class="card">
            <h2>Clientes Registrados</h2>
            <table>
                <thead>
                    <tr><th>Nome</th><th>CPF</th><th>Telefone</th><th style="width:120px; text-align:center;">Ações</th></tr>
                </thead>
                <tbody id="lista-clientes"></tbody>
            </table>
        </div>
    </div>

    <script>
        let clientesLista = [];
        function carregarClientes() {
            fetch('/listar-clientes').then(res => res.json()).then(data => {
                clientesLista = data;
                const t = document.getElementById('lista-clientes');
                t.innerHTML = "";
                data.forEach(c => {
                    t.innerHTML += `<tr>
                        <td><strong>${c.nome}</strong></td><td>${c.cpf}</td><td>${c.telefone}</td>
                        <td style="text-align:center;">
                            <button onclick="prepararEdicao(${c.id})" style="width:auto; padding:5px 10px; margin:0 2px; background:#23232a; color:white;">✏️</button>
                            <button onclick="excluirCliente(${c.id})" style="width:auto; padding:5px 10px; margin:0 2px; background:var(--accent-red); color:white;">🗑️</button>
                        </td>
                    </tr>`;
                });
            });
        }

        document.getElementById('form-cliente').addEventListener('submit', function(e) {
            const id = document.getElementById('cliente-id').value;
            if(id) {
                e.preventDefault();
                fetch(`/editar-cliente/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nome: document.getElementById('nome').value,
                        cpf: document.getElementById('cpf').value,
                        telefone: document.getElementById('telefone').value
                    })
                }).then(res => res.json()).then(res => {
                    if(res.success) { alert("Cliente atualizado!"); cancelarEdicao(); carregarClientes(); }
                });
            }
        });

        function prepararEdicao(id) {
            const c = clientesLista.find(item => item.id === id);
            if(!c) return;
            document.getElementById('cliente-id').value = c.id;
            document.getElementById('nome').value = c.nome;
            document.getElementById('cpf').value = c.cpf;
            document.getElementById('telefone').value = c.telefone;
            document.getElementById('titulo-form').innerText = "Editar Cliente";
            document.getElementById('btn-submit').innerText = "💾 Atualizar";
            document.getElementById('btn-cancelar').style.display = "block";
        }

        function cancelarEdicao() {
            document.getElementById('cliente-id').value = "";
            document.getElementById('form-cliente').reset();
            document.getElementById('titulo-form').innerText = "Cadastro de Cliente Maromba";
            document.getElementById('btn-submit').innerText = "Salvar Cliente";
            document.getElementById('btn-cancelar').style.display = "none";
        }

        function excluirCliente(id) {
            if(confirm("Deseja remover este cliente?")) {
                fetch(`/excluir-cliente/${id}`, { method: 'DELETE' }).then(res => res.json()).then(res => { if(res.success) carregarClientes(); });
            }
        }
        window.onload = carregarClientes;
    </script>
</body>
</html>
