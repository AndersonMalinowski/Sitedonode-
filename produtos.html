<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="estilo.css">
    <title>Alpha Supps - Catálogo</title>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="clientes.html">Clientes</a>
        <a href="produtos.html">Produtos</a>
        <a href="vendas.html">Montar Carrinho</a>
        <a href="historico_vendas.html">Histórico de Vendas</a>
        <a href="/logout" style="margin-left: auto; font-weight: bold;">🚪 Sair</a>
    </nav>

    <header class="banner">
        <h1>Catálogo de Suplementos</h1>
        <p>Cadastre Whey Protein, Creatinas, Hipercalóricos e mais</p>
    </header>

    <div class="container">
        <div class="card">
            <h2>Novo Suplemento</h2>
            <form action="/salvar-produto" method="POST">
                <label for="descricao">Nome do Suplemento:</label>
                <input type="text" id="descricao" name="descricao" placeholder="Ex: Whey Isolado 100% Pure" required>
                
                <label for="preco">Preço de Venda (R$):</label>
                <input type="number" step="0.01" id="preco" name="preco" placeholder="0.00" required>
                
                <label for="peso_gramas">Peso da Embalagem (Gramas):</label>
                <input type="number" id="peso_gramas" name="peso_gramas" placeholder="Ex: 900" required>
                
                <button type="submit">💪 Cadastrar no Sistema</button>
            </form>
        </div>

        <div class="card">
            <h2>Estoque Atual</h2>
            <table>
                <thead>
                    <tr>
                        <th>Descrição</th>
                        <th>Tamanho (g)</th>
                        <th>Preço</th>
                    </tr>
                </thead>
                <tbody id="lista-produtos"></tbody>
            </table>
        </div>
    </div>

    <script>
        fetch('/listar-produtos')
            .then(res => res.json())
            .then(produtos => {
                const tabela = document.getElementById('lista-produtos');
                produtos.forEach(p => {
                    tabela.innerHTML += `
                        <tr>
                            <td><strong>${p.descricao}</strong></td>
                            <td>${p.peso_gramas}g</td>
                            <td style="color:var(--primary-neon)">R$ ${p.preco.toFixed(2)}</td>
                        </tr>`;
                });
            })
            .catch(err => console.error(err));
    </script>
</body>
</html>
