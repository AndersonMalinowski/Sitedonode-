<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>SupleFit Store - Suplementos para Academia</title>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="produtos.html">Produtos</a>
        <a href="carrinho.html">Carrinho</a>
        <a href="clientes.html">Cadastro</a>
    </nav>

    <header class="banner">
        <h1>SupleFit Store</h1>
        <p>Suplementação de alta qualidade para seus resultados</p>
    </header>

    <div class="container">
        <h2>🏋️ Melhores Produtos</h2>
        <div id="destaques" class="produtos-grid"></div>
    </div>

    <script>
        fetch('/produtos')
            .then(r => r.json())
            .then(produtos => {
                const container = document.getElementById('destaques');
                produtos.slice(0, 4).forEach(p => {
                    container.innerHTML += `
                        <div class="card">
                            <h3>${p.nome}</h3>
                            <p>R$ ${p.preco.toFixed(2)}</p>
                            <button onclick="adicionarAoCarrinho(${p.id}, '${p.nome}', ${p.preco})">Adicionar ao Carrinho</button>
                        </div>`;
                });
            });

        function adicionarAoCarrinho(id, nome, preco) {
            let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];
            carrinho.push({id, nome, preco, qtd: 1});
            localStorage.setItem('carrinho', JSON.stringify(carrinho));
            alert(`${nome} adicionado ao carrinho!`);
        }
    </script>
</body>
</html>
